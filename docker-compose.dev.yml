services:
  postgres:
    image: postgres:16
    container_name: panchayat-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: panchayat
    ports:
      - "5433:5432"
    volumes:
      - panchayat-postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d panchayat"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  panchayat-postgres-dev-data:
