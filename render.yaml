# Render Blueprint for the Panchayat API (apps/api) — staging on the free tier.
# Deploy: Render Dashboard → New → Blueprint → pick this repo. Then set the
# secret env vars marked `sync: false` in the dashboard (they are NOT in git).
#
# The two Next.js apps (apps/citizen, apps/admin) are hosted on Vercel, not here
# — see apps/api/docs/staging-deploy.md for the full walkthrough.
services:
  - type: web
    name: panchayat-api
    runtime: node
    plan: free
    region: singapore # closest free region to India; match your Neon region
    rootDir: .
    # Node version comes from .nvmrc (20). pnpm is activated via corepack
    # (version pinned by package.json "packageManager"). `prisma migrate deploy`
    # runs here (build env has the DB env vars) so each deploy applies pending
    # migrations before the new instance starts.
    #
    # - `NODE_ENV=development` on install ONLY: Render exposes the service's
    #   NODE_ENV=production to the build, which makes pnpm skip devDependencies
    #   — but the build needs them (@nestjs/cli, prisma, turbo, typescript).
    #   The running service still gets NODE_ENV=production from envVars below.
    # - `turbo run build --filter=@pg/api` (not `pnpm --filter @pg/api build`):
    #   the API imports runtime values from @pg/types, whose dist/ is
    #   gitignored; turbo's `^build` compiles it first (same as vercel.json).
    buildCommand: >-
      corepack enable &&
      NODE_ENV=development pnpm install --frozen-lockfile &&
      pnpm --filter @pg/api exec prisma generate &&
      pnpm turbo run build --filter=@pg/api &&
      pnpm --filter @pg/api exec prisma migrate deploy
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MSG91_PROVIDER
        value: live
      - key: SESSION_COOKIE_NAME
        value: pg_session
      - key: SESSION_TTL_HOURS
        value: "720"
      # --- Secrets / per-environment values: set these in the Render dashboard ---
      - key: DATABASE_URL # Neon POOLED url (?sslmode=require)
        sync: false
      - key: DIRECT_DATABASE_URL # Neon DIRECT url (migrations)
        sync: false
      - key: MSG91_AUTHKEY # MSG91 server authkey (secret)
        sync: false
      - key: CORS_ORIGIN_CITIZEN # https://<citizen>.vercel.app
        sync: false
      - key: CORS_ORIGIN_ADMIN # https://<admin>.vercel.app
        sync: false
      # Shared with BOTH Vercel projects (same value): proves a request came
      # from our BFF so the API trusts its end-user ip/user-agent headers
      # (per-user rate limits + real audit IPs). >= 32 random chars. Blank =
      # feature off (every user shares one rate-limit bucket).
      - key: BFF_SHARED_SECRET
        sync: false
